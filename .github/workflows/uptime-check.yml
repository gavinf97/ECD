# ECD uptime tracker: check every resource in uptime/resources.yml once an hour, for ever.
# Code comes from main (uptime/ only); results are committed to the `uptime-data` branch,
# squashed to one commit per UTC day, so main's history is never touched by the tracker.
# The branch is also the GitHub Pages source, so pushing to it republishes the dashboard.
name: uptime-check

on:
  schedule:
    # Four crons for an hourly target. GitHub's scheduler is best-effort and drops most ticks:
    # a single "17 * * * *" delivered only 5-7 runs a day here. Extra ticks keep coverage near
    # hourly; extra runs are harmless (coverage is capped at 100%) and free on a public repo.
    # uptime/README.md "Check interval" explains.
    - cron: "3 * * * *"
    - cron: "17 * * * *"
    - cron: "33 * * * *"
    - cron: "49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tracker code (uptime/ only)
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: uptime

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: uptime-data
          path: _data
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo/uptime/requirements.txt

      - name: Install
        run: pip install -r repo/uptime/requirements.txt

      - name: Run checks
        run: python repo/uptime/scripts/check.py --config repo/uptime/resources.yml --data _data

      - name: Summarise
        run: python repo/uptime/scripts/summarize.py --config repo/uptime/resources.yml --data _data

      - name: Publish the dashboard
        run: |
          cp repo/uptime/dashboard/index.html _data/index.html
          touch _data/.nojekyll   # serve paths starting with _ and skip the Jekyll build

      - name: Show the status in this run's summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("_data/summary.json"))
          t, m = s["totals"], s["monitoring"]
          print(f"## {'🔴' if m['stale'] else '🟢'} {s['resource_count']} resources checked\n")
          print(f"🟢 up **{t['up']}** · 🟡 challenged **{t['challenged']}** · "
                f"🔴 down **{t['down']}** · 🔗 URL review **{t['url_review']}**\n")
          print(f"Run {m['runs_total']} · checked every {m['interval_minutes']} min · {s['generated']}\n")
          print("[Dashboard](https://gavinf97.github.io/ECD/) · "
                "[STATUS.md](https://github.com/gavinf97/ECD/blob/uptime-data/STATUS.md)\n")
          down = [r for r in s["resources"] if r["state"] == "down"]
          if down:
              print(f"<details><summary>{len(down)} down</summary>\n")
              print("| Resource | Reason | Since |\n|---|---|---|")
              for r in sorted(down, key=lambda r: r["name"].lower()):
                  print(f"| {r['name']} | `{r['reason']}` | {r['since']} |")
              print("\n</details>")
          PY

      - name: Commit results (one commit per UTC day)
        working-directory: _data
        run: |
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "$bot_email"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          lease=$(git rev-parse HEAD)
          subject="uptime data $(date -u +%F)"
          if [ "$(git log -1 --format=%s)" = "$subject" ] && [ "$(git log -1 --format=%ae)" = "$bot_email" ]; then
            git commit --amend --no-edit --quiet
          else
            git commit -m "$subject" --quiet
          fi
          git push --force-with-lease="uptime-data:$lease" origin HEAD:uptime-data
